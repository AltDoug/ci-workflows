name: test

# One reusable test job for every stack: optional toolchain setup, then the
# repo's own command. Callers keep ~10 lines and pin @v1, so a change here
# reaches every repo when the v1 tag moves.
#
# Caller (hosted Linux):
#   jobs:
#     test:
#       uses: AltDoug/ci-workflows/.github/workflows/test.yml@v1
#       with:
#         setup: uv
#         command: uv run pytest -q
#
# setup: space-separated, any of: uv bun node java
#   uv   -> astral-sh/setup-uv (+ python-version)
#   bun  -> oven-sh/setup-bun
#   node -> actions/setup-node (node-version)
#   java -> actions/setup-java temurin (java-version) + gradle/actions/setup-gradle
# runs-on: a JSON value — '"ubuntu-latest"' (default) or a label array from
# pick-runner. Commands run in bash on every OS (Git Bash on Windows).

on:
  workflow_call:
    inputs:
      command:
        description: shell command(s) that must exit 0 (multi-line allowed)
        type: string
        required: true
      setup:
        description: toolchains to install, space-separated (uv bun node java)
        type: string
        default: ""
      runs-on:
        description: JSON runs-on value
        type: string
        default: '"ubuntu-latest"'
      working-directory:
        type: string
        default: .
      python-version:
        type: string
        default: ""
      node-version:
        type: string
        default: "22"
      java-version:
        type: string
        default: "21"
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: contains(format(' {0} ', inputs.setup), ' uv ')
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - if: contains(format(' {0} ', inputs.setup), ' bun ')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - if: contains(format(' {0} ', inputs.setup), ' node ')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - if: contains(format(' {0} ', inputs.setup), ' java ')
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - if: contains(format(' {0} ', inputs.setup), ' java ')
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Where this ran
        run: echo "runner=${RUNNER_NAME} os=${RUNNER_OS} env=${RUNNER_ENVIRONMENT}"

      - name: Test
        env:
          CI_COMMAND: ${{ inputs.command }}
        run: bash -eo pipefail -c "$CI_COMMAND"
